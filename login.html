<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://dsjhaivwhjtcynwkthiu.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'self' blob:; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
  <title>Anmelden · MYVELO Service</title>
  <link rel="stylesheet" href="assets/css/app.css?v=7.9.2">
  <link rel="stylesheet" href="assets/css/login.css?v=7.4">
  <script>
    if (window.top !== window.self) {
      document.documentElement.style.display = "none";
    }
  </script>
</head>
<body class="employee-login-page">
  <main class="employee-login-shell">
    <section class="employee-login-card">
      <div class="employee-login-brand">
        <img class="brand-logo-image" src="assets/brand/myvelo-logo.png?v=7.4" width="132" height="25" alt="MYVELO">
        <span></span>
        <strong>SERVICE</strong>
      </div>

      <div class="employee-login-copy">
        <span class="employee-login-kicker">Mitarbeiterbereich</span>
        <h1>Anmelden</h1>
        <p>Firmen-Login-Key eingeben.</p>
      </div>

      <div id="login-error" class="notice notice--danger hidden"></div>

      <form id="login-form" class="employee-login-form">
        <label>
          <span>Login-Key</span>
          <input
            name="company_key"
            type="password"
            autocomplete="current-password"
            autocapitalize="none"
            spellcheck="false"
            maxlength="256"
            required
          >
        </label>

        <button class="flow-action primary employee-login-submit" type="submit">
          Anmelden
        </button>
      </form>

      <small class="employee-login-foot">
        Sitzung endet automatisch und wird beim Schließen des Browsers verworfen.
      </small>
    </section>
  </main>

  <script type="module" src="assets/js/login.js?v=7.9"></script>
</body>
</html>
